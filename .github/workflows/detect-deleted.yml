name: Detect Deleted Pages

on:
  # 定期起動は panopticon の apps/sync（panopticon-sync）が workflow_dispatch で行う。
  # 起動先は site DB の sync_job_settings で切り替える（panopticon の apps/sync/CLAUDE.md）
  workflow_dispatch:
    inputs:
      site:
        description: '対象サイト（空欄で全サイト）'
        type: choice
        options:
          - ''
          - scp-jp
          - scp-jp-sandbox3
          - scp-jp-storage
          - scp-jp-sandbox2
          - scpsandbox-jp
          - 05command-ja
        default: ''

jobs:
  detect-deleted:
    name: Detect Deleted Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panopticon/batch
    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PANOPTICON_DEPLOY_KEY }}

      - name: Clone panopticon
        run: git clone --depth 1 git@github.com:scp-jp/panopticon.git panopticon
        working-directory: ${{ github.workspace }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Python環境セットアップ
        run: uv sync

      - name: 削除ページを検出
        run: |
          if [ -n "${{ inputs.site }}" ]; then
            uv run scripts/detect_deleted.py ${{ inputs.site }}
          else
            uv run scripts/detect_deleted.py
          fi
        env:
          PANOPTICON_API_URL: https://manage.scp-jp.com/
          PANOPTICON_API_KEY: ${{ secrets.PANOPTICON_API_KEY }}
          WIKIDOT_USERNAME: ${{ secrets.WIKIDOT_USERNAME }}
          WIKIDOT_PASSWORD: ${{ secrets.WIKIDOT_PASSWORD }}
